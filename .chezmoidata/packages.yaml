  darwin:
    all:
      taps:
        # A tap may be given either as a plain string or as a map with
        # `name`, optional `url` and optional `trusted`. `trusted: true`
        # suppresses Homebrew's confirmation prompt for a third-party tap, so
        # it is opt-in per tap rather than blanket-applied: only set it for
        # taps whose maintainers you have actually decided to trust.
        - name: protonpass/tap
          trusted: true
