        - nushell
        - uutils-coreutils
        - uutils-diffutils
        - uutils-findutils
        - starship
        - viddy
        - zoxide
        - gnupg
        - ykman
        - pinentry-mac
        - wget
        - ripgrep
        - mole
        - protonpass/tap/pass-cli
        - rustnet
