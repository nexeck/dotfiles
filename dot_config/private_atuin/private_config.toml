# Only the settings that differ from atuin's defaults. The upstream example
# config ships every option commented out; see
# https://docs.atuin.sh/configuration/config/ for the full reference.

## don't store commands that look like they contain secrets
secrets_filter = true

## pressing Enter runs the selected command instead of only putting it on the
## prompt line
enter_accept = true

[stats]
## noise to leave out of `atuin stats`
ignored_commands = ["cd", "ls", "eza", "z", "rm"]

[sync]
## use the newer record-based sync protocol
records = true
